[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lootlizard"
version = "0.8.1"
description = "An on-demand PUBG map companion with community-maintained map data"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "LootLizard contributors"}]

dependencies = ["Pillow>=11,<13", "opencv-python-headless>=4.13,<5", "numpy>=2,<3", "velopack==1.2.161; sys_platform == 'win32'"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/molnard-labs/LootLizard"
Repository = "https://github.com/molnard-labs/LootLizard"
Issues = "https://github.com/molnard-labs/LootLizard/issues"

[project.scripts]
lootlizard = "lootlizard.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lootlizard*"]
exclude = ["tests*"]

[tool.setuptools.data-files]
"data" = ["data/*.json"]
