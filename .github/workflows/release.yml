name: Build Windows installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'
      - name: Install build dependencies
        run: python -m pip install . "pyinstaller>=6.11,<7"
      - name: Install the matching Velopack build tool
        shell: pwsh
        run: dotnet tool install --tool-path "$env:RUNNER_TEMP/vpk" vpk --version 1.2.161
      - name: Check release tag matches the application
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $appVersion = python -c "from lootlizard import __version__; print(__version__)"
          if ($appVersion -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw "Only stable versions can publish to the win update channel" }
          if ($env:GITHUB_REF_NAME -ne "v$appVersion") { throw "Release tag does not match the application version" }
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build application
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name LootLizard --add-data 'data;data' --collect-all PIL --collect-all cv2 --collect-all numpy --collect-all velopack --distpath dist --workpath build --specpath . launcher.py
      - name: Bundle source, notices, and build metadata
        shell: pwsh
        run: |
          $bundleLabel = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.Substring(1) } else { "manual-$($env:GITHUB_SHA.Substring(0, 12))" }
          python scripts/package_release.py --binary dist/LootLizard --output release --label $bundleLabel
          if ($LASTEXITCODE -ne 0) { throw "Source bundle packaging failed" }
      - name: Build the per-user installer and full update feed
        shell: pwsh
        run: |
          $payload = @(Get-ChildItem -LiteralPath release -Directory | Where-Object { $_.Name -like 'LootLizard-*-windows-x64' })
          if ($payload.Count -ne 1) { throw "Expected exactly one enriched Windows payload" }
          python scripts/build_installer.py --payload $payload[0].FullName --output release/velopack --vpk "$env:RUNNER_TEMP/vpk/vpk.exe" --release-root release
          if ($LASTEXITCODE -ne 0) { throw "Velopack packaging failed" }
      - name: Test real install, staged SDK update, and uninstall
        id: integration
        shell: pwsh
        env:
          LOOTLIZARD_INSTALL_TEST: '1'
        run: |
          $payload = @(Get-ChildItem -LiteralPath release -Directory | Where-Object { $_.Name -like 'LootLizard-*-windows-x64' })
          ./scripts/test_installer.ps1 -Payload $payload[0].FullName -Feed release/velopack -Vpk "$env:RUNNER_TEMP/vpk/vpk.exe"
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LootLizard-windows-x64
          path: |
            release/*.zip
            release/velopack/LootLizard-Setup.exe
            release/velopack/releases.win.json
            release/velopack/*-full.nupkg
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload installer integration evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LootLizard-installer-integration
          path: |
            ${{ runner.temp }}/lootlizard-install-*/integration-report.json
            ${{ runner.temp }}/lootlizard-install-*/*.json
            ${{ runner.temp }}/lootlizard-install-*/*.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseAssets = @((Resolve-Path release/velopack/LootLizard-Setup.exe).Path)
          $releaseAssets += (Resolve-Path release/velopack/releases.win.json).Path
          $releaseAssets += @(Get-ChildItem release/velopack/*-full.nupkg | ForEach-Object FullName)
          $releaseAssets += @(Get-ChildItem release/*.zip | ForEach-Object FullName)
          $releaseAssets += (Resolve-Path release/SHA256SUMS.txt).Path
          # Keep the update feed undiscoverable until every asset upload succeeds.
          gh release create "$env:GITHUB_REF_NAME" @releaseAssets --verify-tag --draft --title "LootLizard $env:GITHUB_REF_NAME" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "Draft release creation/upload failed" }
          gh release edit "$env:GITHUB_REF_NAME" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Draft release publication failed" }
