name: Build Windows bundle

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build dependencies
        run: python -m pip install . "pyinstaller>=6.11,<7"
      - name: Check release tag matches the application
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $appVersion = python -c "from lootlizard import __version__; print(__version__)"
          if ($env:GITHUB_REF_NAME -ne "v$appVersion") { throw "Release tag does not match the application version" }
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build application
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name LootLizard --add-data 'data;data' --collect-all PIL --collect-all cv2 --collect-all numpy --distpath dist --workpath build --specpath . launcher.py
      - name: Bundle source, notices, and build metadata
        shell: pwsh
        run: |
          $bundleLabel = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.Substring(1) } else { "manual-$($env:GITHUB_SHA.Substring(0, 12))" }
          python scripts/package_release.py --binary dist/LootLizard --output release --label $bundleLabel
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LootLizard-windows-x64
          path: |
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseAssets = @(Get-ChildItem release/*.zip | ForEach-Object FullName)
          $releaseAssets += (Resolve-Path release/SHA256SUMS.txt).Path
          gh release create "$env:GITHUB_REF_NAME" @releaseAssets --verify-tag --title "LootLizard $env:GITHUB_REF_NAME" --generate-notes
