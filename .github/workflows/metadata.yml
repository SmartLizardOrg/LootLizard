name: Publish map metadata

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/build_map_catalog.py'
      - 'tests/test_map_catalog.py'
      - 'lootlizard/core.py'
      - 'lootlizard/map_updates.py'
      - '.github/workflows/metadata.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-map-metadata
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only trusted main code runs with this job's write token. No PR trigger.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Validate newest main and build one complete snapshot
        id: source
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          python -m unittest discover -s tests -p test_map_catalog.py -v
          python scripts/build_map_catalog.py --revision "$revision" --output "$RUNNER_TEMP/maps.json"
      - name: Publish atomic metadata branch commit
        shell: bash
        env:
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/lootlizard-metadata"
          if git ls-remote --exit-code --heads origin metadata >/dev/null; then
            git fetch origin metadata:refs/remotes/origin/metadata
            git worktree add --detach "$destination" refs/remotes/origin/metadata
          else
            git worktree add --detach "$destination" HEAD
            git -C "$destination" switch --orphan metadata-publish
          fi
          git -C "$destination" rm -r -f --ignore-unmatch .
          cp "$RUNNER_TEMP/maps.json" "$destination/maps.json"
          git -C "$destination" add -- maps.json
          if git -C "$destination" diff --cached --quiet; then
            echo 'Metadata is already current.'
            exit 0
          fi
          git -C "$destination" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Update map metadata for $SOURCE_REVISION"
          git -C "$destination" push origin HEAD:refs/heads/metadata
