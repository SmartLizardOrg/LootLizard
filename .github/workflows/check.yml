name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install .
      - name: Check source syntax
        run: python -m compileall -q lootlizard launcher.py
      - name: Validate community map snapshot
        shell: pwsh
        run: python scripts/build_map_catalog.py --revision $env:GITHUB_SHA --output "$env:RUNNER_TEMP/maps.json"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
